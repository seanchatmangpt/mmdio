name: Planning Documentation Crown

on:
  pull_request:
    paths:
      - "src/mmdio/planning/**"
      - "src/mmdio/cli.py"
      - "scripts/planning_crown.py"
      - "tests/test_planning.py"
      - "tests/test_planning_cli_integration.py"
      - "tests/oracle/planning_oracle.mjs"
      - "docs/planning.md"
      - "examples/planning/**"
      - ".github/workflows/planning-documentation-crown.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planning-documentation-crown-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-planning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Install Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python validation capsule
        run: python -m pip install --disable-pip-version-check -e ".[all]" pytest==9.1.1

      - name: Compile planning source and crown
        run: >-
          python -m compileall -q
          src/mmdio/planning src/mmdio/cli.py scripts/planning_crown.py
          tests/test_planning.py tests/test_planning_cli_integration.py

      - name: Execute focused planning tests
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q -c /dev/null
          tests/test_planning.py tests/test_planning_cli_integration.py

      - name: Manufacture five-formalism planning corpus
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python scripts/planning_crown.py --output /tmp/planning-crown | tee /tmp/planning-crown.json

      - name: Verify topology projections against the bounded ALIVE flowchart crown
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from mmdio.flowchart_crown import parse_flowchart

          files = sorted(Path("/tmp/planning-crown").glob("*/diagrams/topology.flowchart.mmd"))
          if len(files) != 5:
              raise SystemExit(f"expected 5 topology subjects, observed {len(files)}")
          for path in files:
              parse_flowchart(path.read_text(encoding="utf-8"))
          print(json.dumps({"schema":"mmdio.planning-flowchart-crown/1","parsed":len(files)}, sort_keys=True))
          PY

      - name: Install pinned Mermaid 11.16.0 oracle
        working-directory: tests/oracle
        run: npm ci

      - name: Parse every generated planning document with Mermaid
        run: |
          set -o pipefail
          mapfile -d '' diagrams < <(find /tmp/planning-crown -type f -name '*.mmd' -print0 | sort -z)
          if [ "${#diagrams[@]}" -eq 0 ]; then
            echo "no planning diagrams generated" >&2
            exit 1
          fi
          node tests/oracle/planning_oracle.mjs "${diagrams[@]}" | tee /tmp/planning-mermaid.json

      - name: Execute checked-in enterprise example through both CLIs
        env:
          PYTHONPATH: src
        run: |
          python -m mmdio.planning project examples/planning/enterprise.ppddl.json --output /tmp/enterprise-module
          mmdio planning examples/planning/enterprise.ppddl.json --output /tmp/enterprise-cli
          test -s /tmp/enterprise-module/plan.md
          test -s /tmp/enterprise-module/manifest.json
          cmp /tmp/enterprise-module/plan.md /tmp/enterprise-cli/plan.md
          cmp /tmp/enterprise-module/manifest.json /tmp/enterprise-cli/manifest.json

      - name: Emit exact-head receipt summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def read(path):
              candidate = Path(path)
              if not candidate.exists():
                  return None
              lines = [line for line in candidate.read_text().splitlines() if line.strip()]
              return json.loads(lines[-1]) if lines else None

          print(json.dumps({
              "schema": "mmdio.planning-workflow/1",
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "planning_crown": read("/tmp/planning-crown.json"),
              "mermaid_oracle": read("/tmp/planning-mermaid.json"),
              "claim": "FIVE_FORMALISM_RECEIPT_BEARING_MERMAID_PROJECTION_ONLY",
          }, sort_keys=True))
          PY
