name: mmdio PaaS Semantic Crown

on:
  pull_request:
    paths:
      - "ggen.toml"
      - "packs/mmdio-paas-pack/**"
      - "platform/mmdio_paas/**"
      - ".github/workflows/paas-semantic-crown.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmdio-paas-semantic-crown-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-paas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Install Python 3.13 and mmdio
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip

      - name: Install mmdio execution subject
        run: python -m pip install --disable-pip-version-check -e ".[all]" rdflib==7.5.0

      - name: Validate public ontology graph locally
        run: |
          python - <<'PY'
          from rdflib import Graph, Namespace, RDF

          graph = Graph().parse("packs/mmdio-paas-pack/ontology.ttl", format="turtle")
          PAAS = Namespace("https://seanchatmangpt.github.io/ontology/mmdio/paas#")
          DCAT = Namespace("http://www.w3.org/ns/dcat#")
          RR = Namespace("http://www.w3.org/ns/r2rml#")
          SH = Namespace("http://www.w3.org/ns/shacl#")

          required = [
              (PAAS.service, RDF.type, DCAT.DataService),
              (PAAS.RenderIntentTriplesMap, RDF.type, RR.TriplesMap),
              (PAAS.RenderIntentShape, RDF.type, SH.NodeShape),
          ]
          missing = [triple for triple in required if triple not in graph]
          if missing:
              raise SystemExit(f"public ontology admission failed: {missing!r}")
          print(f"PAAS_ONTOLOGY_PARTIAL_ALIVE triples={len(graph)}")
          PY

      - name: Build pinned ggen manufacturing tool
        run: |
          git clone --filter=blob:none https://github.com/seanchatmangpt/ggen /tmp/ggen
          git -C /tmp/ggen checkout --detach 1e9fcb9679a61460fbd641415cb72511c7e50b33
          rustup toolchain install nightly-2026-06-22 --profile minimal
          cargo +nightly-2026-06-22 build \
            --manifest-path /tmp/ggen/Cargo.toml \
            -p ggen-cli-lib --bin ggen

      - name: Regenerate PaaS projections with isolated receipt chain
        run: |
          set -euo pipefail
          crown=/tmp/mmdio-paas-crown
          rm -rf "$crown"
          mkdir -p "$crown"
          # The repository's historical root .ggen-v2 chain is evidence for a
          # different manufacture lineage.  Reusing it for this exact-head PaaS
          # court couples independent products and correctly trips FM-CHAIN-009.
          # Manufacture the admitted source tree in a fresh receipt domain, then
          # compare only the PaaS consequences back to the candidate checkout.
          rsync -a --exclude='.git' --exclude='.ggen-v2' ./ "$crown/"
          (cd "$crown" && /tmp/ggen/target/debug/ggen sync run)
          diff -ru "$crown/platform/mmdio_paas" platform/mmdio_paas
          diff -ru "$crown/packs/mmdio-paas-pack" packs/mmdio-paas-pack
          test -f "$crown/.ggen-v2/receipt.json"

      - name: Install OTP and Elixir from ash_r2rml toolchain capsule
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2.4"
          elixir-version: "1.18.4-otp-27"

      - name: Compile PaaS with warnings as errors
        working-directory: platform/mmdio_paas
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile --warnings-as-errors

      - name: Execute Ash + AshR2RML + Reactor + BRCE tests
        working-directory: platform/mmdio_paas
        env:
          MMDIO_PYTHON: python3
          PYTHONPATH: ../../src
        run: mix test --trace

      - name: Execute deterministic replay receipt
        working-directory: platform/mmdio_paas
        env:
          MMDIO_PYTHON: python3
          PYTHONPATH: ../../src
        run: |
          mix run -e '
          source = "flowchart LR\n  A[Admit]\n  B[Receipt]\n  A --> B\n"
          {:ok, a} = MmdioPaaS.render(source)
          {:ok, b} = MmdioPaaS.render(source)
          true = a.status == "ALIVE"
          true = a.receipt.receipt_sha256 == b.receipt.receipt_sha256
          IO.puts("PAAS_REPLAY_ALIVE receipt_sha256=#{a.receipt.receipt_sha256}")
          '

      - name: Emit bounded exact-head receipt
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          generation_receipt = Path("/tmp/mmdio-paas-crown/.ggen-v2/receipt.json")
          print(json.dumps({
              "schema": "mmdio-paas-exact-head-workflow/v1",
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "ggen_receipt_present": generation_receipt.exists(),
              "receipt_domain": "isolated-exact-head-paas",
              "ash_r2rml_ref": "067954ad406fd637fd47646bdb10c4580809c79d",
              "ggen_ref": "1e9fcb9679a61460fbd641415cb72511c7e50b33",
              "claim_ceiling": "MMDIO_PAAS_EXACT_HEAD_ASH_R2RML_REACTOR_BRCE_ONLY"
          }, sort_keys=True))
          PY
