name: Planning DFCM Crown

on:
  pull_request:
    paths:
      - "src/mmdio/planning/**"
      - "scripts/planning_crown.py"
      - "tests/test_planning_dfcm.py"
      - "tests/oracle/planning_oracle.mjs"
      - "docs/planning-dfcm.md"
      - ".github/workflows/planning-dfcm-crown.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planning-dfcm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-dfcm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Install Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip

      - name: Install DFCM validation capsule
        run: python -m pip install --disable-pip-version-check -e ".[all]" pytest==9.1.1

      - name: Compile DFCM surface
        run: >-
          python -m compileall -q
          src/mmdio/planning/dfcm.py
          src/mmdio/planning/bundle.py
          src/mmdio/planning/io.py
          tests/test_planning_dfcm.py

      - name: Execute DFCM laws
        env:
          PYTHONPATH: src
        run: python -m pytest -q -c /dev/null tests/test_planning_dfcm.py

      - name: Manufacture five-formalism corpus
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python scripts/planning_crown.py --output /tmp/planning-dfcm-crown \
            | tee /tmp/planning-crown-base.json

      - name: Prove forty-cell combinatorial closure
        run: |
          python - <<'PY' | tee /tmp/planning-dfcm.json
          from pathlib import Path
          import hashlib
          import json

          root = Path("/tmp/planning-dfcm-crown")
          matrices = sorted(root.glob("*/dfcm.json"))
          if len(matrices) != 5:
              raise SystemExit(f"expected 5 DFCM matrices, observed {len(matrices)}")

          candidates = admitted = refused = 0
          subjects = []
          for path in matrices:
              payload = json.loads(path.read_text(encoding="utf-8"))
              cells = payload["cells"]
              if payload["candidate_count"] != 8 or len(cells) != 8:
                  raise SystemExit(f"{path}: expected exactly 8 projection candidates")

              statuses = {cell["status"] for cell in cells}
              if not statuses <= {"ADMITTED", "REFUSED"}:
                  raise SystemExit(f"{path}: illegal DFCM status {statuses!r}")

              expected_admitted = {
                  cell["candidate"]["projection"]
                  for cell in cells
                  if cell["status"] == "ADMITTED"
              }
              expected_refused = {
                  cell["candidate"]["projection"]
                  for cell in cells
                  if cell["status"] == "REFUSED"
              }
              actual_admitted = {
                  diagram.name.split(".", 1)[0]
                  for diagram in (path.parent / "diagrams").glob("*.mmd")
              }
              actual_refused = {
                  refusal.name.removesuffix(".refusal.json")
                  for refusal in (path.parent / "refusals").glob("*.refusal.json")
              }

              if actual_admitted != expected_admitted:
                  raise SystemExit(
                      f"{path}: admitted drift expected={sorted(expected_admitted)} "
                      f"actual={sorted(actual_admitted)}"
                  )
              if actual_refused != expected_refused:
                  raise SystemExit(
                      f"{path}: refusal drift expected={sorted(expected_refused)} "
                      f"actual={sorted(actual_refused)}"
                  )

              candidates += payload["candidate_count"]
              admitted += payload["admitted_count"]
              refused += payload["refused_count"]
              subjects.append({
                  "formalism": payload["formalism"],
                  "matrix_sha256": hashlib.sha256(
                      json.dumps(
                          payload,
                          sort_keys=True,
                          separators=(",", ":"),
                          ensure_ascii=False,
                      ).encode()
                  ).hexdigest(),
                  "admitted": sorted(expected_admitted),
                  "refused": sorted(expected_refused),
              })

          if candidates != 40:
              raise SystemExit(f"expected 40 DFCM candidates, observed {candidates}")
          if admitted + refused != 40:
              raise SystemExit(
                  f"DFCM closure violated admitted={admitted} refused={refused}"
              )

          print(json.dumps({
              "schema": "mmdio.planning-dfcm-crown/1",
              "candidate_count": candidates,
              "admitted_count": admitted,
              "refused_count": refused,
              "subjects": subjects,
              "claim": "COMBINATORIAL_PLANNING_DOCUMENT_DESIGN_SPACE_ONLY",
          }, sort_keys=True))
          PY

      - name: Install pinned Mermaid 11.16.0 oracle
        working-directory: tests/oracle
        run: npm ci

      - name: Parse every DFCM-admitted Mermaid document
        run: |
          set -o pipefail
          mapfile -d '' diagrams < <(
            find /tmp/planning-dfcm-crown -type f -name '*.mmd' -print0 | sort -z
          )
          test "${#diagrams[@]}" -gt 0
          node tests/oracle/planning_oracle.mjs "${diagrams[@]}" \
            | tee /tmp/planning-dfcm-mermaid.json

      - name: Emit exact-head DFCM receipt
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def read(path):
              candidate = Path(path)
              if not candidate.exists():
                  return None
              lines = [line for line in candidate.read_text().splitlines() if line.strip()]
              return json.loads(lines[-1]) if lines else None

          print(json.dumps({
              "schema": "mmdio.planning-dfcm-workflow/1",
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "head": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "dfcm": read("/tmp/planning-dfcm.json"),
              "mermaid_oracle": read("/tmp/planning-dfcm-mermaid.json"),
              "claim": "FORTY_CELL_DFCM_PROJECTION_CLOSURE_ONLY",
          }, sort_keys=True))
          PY
