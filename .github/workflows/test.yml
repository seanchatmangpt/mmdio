name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    name: Python ${{ matrix.python-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: Install @devcontainers/cli
        run: npm install --location=global @devcontainers/cli@0.76.0

      - name: Start Dev Container
        run: |
          git config --global init.defaultBranch main
          devcontainer up --workspace-folder .
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Lint app
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          devcontainer exec --workspace-folder . poe lint 2>&1 | tee lint.log

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics-python-${{ matrix.python-version }}
          path: lint.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce lint result
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Test app
        run: devcontainer exec --workspace-folder . poe test
