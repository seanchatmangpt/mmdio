name: Decision Fusion Crown

on:
  pull_request:
    paths:
      - "src/mmdio/decide/**"
      - "src/mmdio/cli.py"
      - "tests/test_decision_*.py"
      - "docs/decision-fusion.md"
      - "pyproject.toml"
      - ".github/workflows/decision-fusion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decision-fusion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-decision-fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install focused decision runtime
        run: python -m pip install --disable-pip-version-check -e ".[decision]" pytest==9.1.1

      - name: Compile authored fusion surfaces
        run: |
          python -m compileall -q src/mmdio/decide src/mmdio/cli.py tests/test_decision_*.py

      - name: Execute service, Typer, FastMCP, and dependency tests
        run: python -m pytest -q -c /dev/null tests/test_decision_*.py

      - name: Verify CLI composition
        run: |
          mmdio --help | grep -q decide
          mmdio decide --help | grep -q catalog
          mmdio decide --help | grep -q solve
