[project]
name = "mmdio"

[ontology]
source = "src/mmdio/engine/registry.ttl"

[ontology.prefixes]
mer = "https://seanchatmangpt.github.io/ontology/mermaid#"
dct = "http://purl.org/dc/terms/"
prov = "http://www.w3.org/ns/prov#"
rdf = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"

[packs]
# lock = false: these are in-repo path packs under active development, so git already
# pins their content. Content-hash locking is for remote/git packs; here it only forces
# a re-lock after every template edit.
mmdio-pack = { path = "packs/mmdio-pack", lock = false }
cyberpunk-2030-pack = { path = "packs/cyberpunk-2030-pack", lock = false }

[templates]
dir = "templates"
