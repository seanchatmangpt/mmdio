[build-system]  # https://docs.astral.sh/uv/concepts/build-backend/
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]  # https://packaging.python.org/en/latest/specifications/pyproject-toml/
name = "mmdio"
version = "0.1.0"
description = "Mermaid Markdown I/O: the universal IO for diagram-as-code workflows"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sean Chatman" }
]
keywords = ["mermaid", "diagrams", "markdown", "visualization", "architecture"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
  "fastapi[all] (>=0.141.1)",
  "gunicorn (>=26.0.0)",
  "poethepoet (>=0.48.0)",
  "typer (>=0.27.0)",
]

[project.scripts]  # https://docs.astral.sh/uv/concepts/projects/config/#command-line-interfaces
mmdio = "mmdio.cli:app"

[project.optional-dependencies]  # https://packaging.python.org/en/latest/specifications/pyproject-toml/#optional-dependencies
all = [
  "lark>=1.3.1",
  "pydantic>=2.13.4",
]

[project.urls]  # https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
homepage = "https://github.com/seanchatmangpt/mmdio"
source = "https://github.com/seanchatmangpt/mmdio"
changelog = "https://github.com/seanchatmangpt/mmdio/blob/main/CHANGELOG.md"
releasenotes = "https://github.com/seanchatmangpt/mmdio/releases"
documentation = "https://seanchatmangpt.github.io/mmdio"
issues = "https://github.com/seanchatmangpt/mmdio/issues"

[dependency-groups]  # https://docs.astral.sh/uv/concepts/projects/dependencies/#development-dependencies
dev = [
  "codespell (>=2.4.3)",
  "commitizen (>=4.17.0)",
  "coverage[toml] (>=7.15.2)",
  "ipykernel (>=7.3.0)",
  "ipython (>=9.15.0)",
  "ipywidgets (>=8.1.8)",
  "mkdocs-material (>=9.7.7)",
  "pre-commit (>=4.6.1)",
  "pytest (>=9.1.1)",
  "pytest-mock (>=3.15.1)",
  "pytest-xdist (>=3.8.0)",
  "ruff (>=0.16.1)",
  "ty (>=0.0.65)",
  "typeguard (>=4.6.0)",
]

[tool.coverage.run]
source = ["mmdio"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]  # https://docs.pytest.org/en/latest/reference/reference.html#ini-options-ref
addopts = "--color=yes --doctest-modules --exitfirst --failed-first --strict-config --strict-markers --verbosity=2 --junitxml=reports/pytest.xml"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
testpaths = ["src", "tests"]
xfail_strict = true

[tool.ruff]  # https://docs.astral.sh/ruff/settings/
fix = true
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "src/mmdio/engine/detect_patterns.py",
    "src/mmdio/engine/enums.py",
    "src/mmdio/engine/fixtures.py",
    "src/mmdio/engine/models.py",
    "src/mmdio/engine/parser_registry.py",
    "src/mmdio/engine/render_dispatch.py",
    "src/mmdio/engine/schemas.py",
    "src/mmdio/engine/supported.py",
    "tests/test_oracle_generated.py",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "D"]

[tool.ruff.lint.isort]
known-first-party = ["mmdio"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]

[tool.poe.tasks]
test = "pytest"
test-cov = "pytest --cov=mmdio --cov-report=term-missing --cov-report=html"
lint = [
    { cmd = "ruff check . --fix" },
    { cmd = "ruff format ." },
    { cmd = "ty check" },
    { cmd = "codespell" },
]
format = [
    { cmd = "ruff check . --fix" },
    { cmd = "ruff format ." },
]
check = ["lint", "test"]

[dependency-groups]
dev = [
    "codespell>=2.4.1",
    "poethepoet>=0.38.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.11",
    "ty>=0.0.8",
]
