[project]
name = "mmdio"
version = "0.1.0"
description = "Mermaid Markdown I/O: the universal IO for diagram-as-code workflows"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sean Chatman" }
]
keywords = ["mermaid", "diagrams", "markdown", "visualization", "architecture"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "pydantic>=2.12.5",
    "lark>=1.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.11",
    "ty>=0.0.8",
    "pre-commit>=4.5.1",
    "codespell>=2.4.1",
    "poethepoet>=0.38.0",
]
all = []

[project.scripts]
mmdio = "mmdio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmdio"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.coverage.run]
source = ["mmdio"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "src/mmdio/engine/detect_patterns.py",
    "src/mmdio/engine/enums.py",
    "src/mmdio/engine/fixtures.py",
    "src/mmdio/engine/models.py",
    "src/mmdio/engine/parser_registry.py",
    "src/mmdio/engine/render_dispatch.py",
    "src/mmdio/engine/schemas.py",
    "src/mmdio/engine/supported.py",
    "tests/test_oracle_generated.py",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "D"]

[tool.ruff.lint.isort]
known-first-party = ["mmdio"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]

[tool.poe.tasks]
test = "pytest"
test-cov = "pytest --cov=mmdio --cov-report=term-missing --cov-report=html"
lint = [
    { cmd = "ruff check . --fix" },
    { cmd = "ruff format ." },
    { cmd = "ty check" },
    { cmd = "codespell" },
]
format = [
    { cmd = "ruff check . --fix" },
    { cmd = "ruff format ." },
]
check = ["lint", "test"]

[dependency-groups]
dev = [
    "codespell>=2.4.1",
    "poethepoet>=0.38.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.11",
    "ty>=0.0.8",
]
